name: CI
on:
  push:
    branches: [main, 'feat/**', 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.90.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: 22
      - name: Frontend dependencies
        if: runner.os == 'Windows'
        run: npm ci --prefix ui --no-audit --no-fund
      - name: Frontend typecheck and build
        if: runner.os == 'Windows'
        run: npm --prefix ui run build
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Windows shell Clippy
        if: runner.os == 'Windows'
        run: cargo clippy -p localclip-app --features desktop --all-targets --locked -- -D warnings
      - name: Core vectors and storage
        run: cargo test -p localclip-core --locked -- --nocapture
      - name: Windows adapter tests (serial)
        if: runner.os == 'Windows'
        run: cargo test -p localclip-app --locked -- --test-threads=1 --nocapture
      - name: Build test utilities
        run: cargo build -p localclip-core --bins --release --locked
      - name: Build Windows demo
        if: runner.os == 'Windows'
        run: cargo build -p localclip-app --bin localclip-demo --release --locked
      - name: Build Windows application
        if: runner.os == 'Windows'
        working-directory: app
        run: ../ui/node_modules/.bin/tauri build --no-bundle --features desktop

      - name: Release service benchmark
        run: cargo run -p localclip-core --release --locked --bin core_benchmark -- reports/ci-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-benchmark-${{ matrix.os }}
          path: reports/ci-benchmark/*.json
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-core-test-utilities
          path: |
            target/release/crash_probe.exe
            target/release/core_benchmark.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-native-demo
          path: target/release/localclip-demo.exe
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-app
          path: target/release/localclip.exe
