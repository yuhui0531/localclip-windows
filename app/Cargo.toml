[package]
name = "localclip-app"
default-run = "localclip"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
desktop = ["dep:tauri", "dep:tauri-build", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-autostart", "dep:tauri-plugin-global-shortcut"]

[[bin]]
name = "localclip"
path = "src/main.rs"
required-features = ["desktop"]

[dependencies]
localclip-core = { path = "../core" }
serde_json.workspace = true
base64.workspace = true
percent-encoding.workspace = true
image.workspace = true
time.workspace = true

[target.'cfg(windows)'.dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-autostart = { version = "2", optional = true }
tauri-plugin-global-shortcut = { version = "2", optional = true }
windows = { version = "0.62", features = [
  "Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams",
  "Win32_Foundation", "Win32_Globalization", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_DataExchange",
  "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole",
  "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_Diagnostics_Debug", "Win32_System_Power", "Win32_System_SystemServices",
  "Win32_UI_Accessibility", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging"
] }

[build-dependencies]
tauri-build = { version = "2", optional = true }
