[workspace]
members = ["core", "app"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
license = "MIT"

[workspace.dependencies]
sha2 = "=0.10.9"
unicode-normalization = "=0.1.24"
unicode-segmentation = "=1.12.0"
serde_json = "=1.0.145"
base64 = "=0.22.1"
percent-encoding = "=2.3.2"
time = { version = "=0.3.44", features = ["local-offset", "formatting", "parsing"] }
rusqlite = { version = "=0.37.0", features = ["bundled", "functions"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg", "bmp", "tiff", "gif", "webp"] }
